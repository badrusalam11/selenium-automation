name: Selenium Docker Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -f Dockerfile.test -t selenium-tests:test .

      - name: Run tests in Docker
        run: docker run --rm -v ${{ github.workspace }}:/app selenium-tests
