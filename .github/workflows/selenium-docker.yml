name: Selenium Docker Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t selenium-tests .

      - name: Run tests in Docker
        run: docker run --rm -v ${{ github.workspace }}:/app selenium-tests

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.html
